<style>
/* No manual width breakout here: on these routes the theme's own

   theme's own CSS - so #content-holder is already the full width of
   .container-fluid (max-width: 1190px, 20px side padding - confirmed
   directly from the theme's compiled CSS). A 100vw/negative-margin

   instead of matching them - that was the cause of the misaligned
