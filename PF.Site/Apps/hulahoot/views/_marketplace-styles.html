<style>
/* Breaks out of the theme's fixed Bootstrap .container (750/970/1170px at
   the standard breakpoints - confirmed from the theme's own compiled
   bootstrap.min.css, not assumed) so these pages can use real laptop/
   desktop width instead of being squeezed into the same column a text
   post uses. Pure content-side technique (100vw + negative margins to
   cancel the parent's own width, then a wider max-width to re-cap it) -
   doesn't touch the site's actual .container CSS, so nothing else on
   the site is affected. */
.hulahoot-wide-wrapper {
    box-sizing: border-box;
}
@media (min-width: 992px) {
    .hulahoot-wide-wrapper {
        width: 100vw;
        position: relative;
        left: 50%;
        right: 50%;
        margin-left: -50vw;
        margin-right: -50vw;
        max-width: 1400px;
        padding: 0 40px;
    }
}
@media (min-width: 1500px) {
    .hulahoot-wide-wrapper {
        max-width: 1600px;
    }
}
